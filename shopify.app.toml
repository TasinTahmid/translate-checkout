# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "9f67996a819f110166729ef557bc8f9f"
application_url = "https://rush-budget-establishment-modules.trycloudflare.com"
embedded = true
name = "translate-checkout"
handle = "translate-checkout"

[webhooks]
api_version = "2025-01"

  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  uri = "/webhooks/app/uninstalled"

  [[webhooks.subscriptions]]
  topics = [ "app/scopes_update" ]
  uri = "/webhooks/app/scopes_update"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_products, write_products,read_translations, write_translations"

[auth]
redirect_urls = [
  "https://rush-budget-establishment-modules.trycloudflare.com/auth/callback",
  "https://rush-budget-establishment-modules.trycloudflare.com/auth/shopify/callback",
  "https://rush-budget-establishment-modules.trycloudflare.com/api/auth/callback"
]

[pos]
embedded = false

[build]
dev_store_url = "store-themeog.myshopify.com"
automatically_update_urls_on_dev = true
include_config_on_deploy = true
